<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Power Solutions">
  <title>Power Solutions</title>
  <!--
    "El conmutador" (docs/styles.md 1.6).

    Variante SOBRE FONDO OSCURO, la que usa la navbar: anillo en blanco para
