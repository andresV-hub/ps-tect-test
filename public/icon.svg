<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Power Solutions">
  <title>Power Solutions</title>
  <!--
    Favicon e icono de la PWA (docs/styles.md 1.6).
    Variante monocroma sobre fondo de marca: a 16px la barra ambar se pierde,
    asi que el conmutador va todo en blanco sobre ps-blue-900.
    Sustituye al circulo rojo del andamiaje de Rails.

    La version rasterizada es public/icon.png, que genera
    script/render_icon.rb a partir de esta misma geometria.

    Ojo: un comentario XML no admite dos guiones seguidos, asi que los nombres
    de los tokens se escriben aqui sin el prefijo de variable CSS.
  -->
  <rect width="512" height="512" rx="112" fill="#0e3b58"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round">
    <path d="M356.95 111.82A176 176 0 1 1 155.05 111.82"/>
    <path d="M256 96V216"/>
  </g>
</svg>
